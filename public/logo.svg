<svg viewBox="0 0 1024 768" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="50%" y1="0%" x2="100%" y2="30%">
      <stop offset="10%" style="stop-color:#ff0085;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Black background -->
